<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <title>Treino · demonstração</title>
  <!-- Tudo o que o app carrega é relativo à raiz do projeto. -->
  <base href="../">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="gym.css">
  <style>
    /* Tela de abertura da demonstração. É só encenação: os dados são gerados na hora. */
    #boot {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; text-align: center; color: #f1f3f5;
      background: radial-gradient(520px 320px at 50% 30%, rgba(163, 230, 53, 0.16), transparent 70%), #0c0e12;
      transition: opacity 400ms ease, visibility 400ms;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot svg { width: 84px; height: 84px; color: #a3e635; animation: lift 1.1s ease-in-out infinite; }
    #boot h1 { font-size: 30px; white-space: normal; }
    #boot .tag { margin: -10px 0 0; color: #a3e635; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    #boot .barwrap { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #1c2028; overflow: hidden; }
    #boot .barwrap i { display: block; height: 100%; width: 0; background: #a3e635; border-radius: 3px; transition: width 380ms ease; }
    #boot p { margin: 0; min-height: 22px; color: #a7adb8; font-size: 15px; }
    @keyframes lift { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } #boot, #boot .barwrap i { transition: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>
    <h1>Treino</h1>
    <p class="tag">Demonstração · dados fictícios</p>
    <div class="barwrap"><i id="bootBar"></i></div>
    <p id="bootText">Abrindo…</p>
  </div>

  <script type="module">
    const steps = [
      [12, 'Carregando exercícios…'],
      [38, 'Montando 12 semanas de treino…'],
      [64, 'Calculando progressão de carga…'],
      [88, 'Preparando sugestões…'],
      [100, 'Pronto'],
    ];
    const bar = document.getElementById('bootBar');
    const text = document.getElementById('bootText');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    // A encenação e o carregamento de verdade correm juntos; a tela some
    // quando os dois terminam.
    const show = (async () => {
      for (const [pct, label] of steps) {
        bar.style.width = `${pct}%`;
        text.textContent = label;
        await wait(520);
      }
    })();

    const load = (async () => {
      // O app é o mesmo da página principal: busca o HTML dele e reaproveita.
      const html = await (await fetch('index.html')).text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      for (const s of doc.querySelectorAll('script')) s.remove();
      document.body.append(...doc.body.childNodes);
      await import('./gym.js');
    })();

    try {
      await Promise.all([show, load]);
      document.getElementById('boot').classList.add('done');
    } catch (err) {
      bar.style.width = '0';
      text.textContent = 'Não foi possível abrir a demonstração. Verifique a conexão e recarregue.';
      console.error(err);
    }
  </script>
</body>
</html>
